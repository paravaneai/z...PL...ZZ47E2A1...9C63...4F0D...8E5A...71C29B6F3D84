  <title id="title">PARAVANE — Badge Lockup with Editable Gold Outline</title>
  <desc id="desc">Original-style gradient P badge integrated with ARAVANE as a horizontal company wordmark. ARAVANE has an editable gold outline with user-adjustable color and thickness.</desc>
