<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<script src="./hosted-preview.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paravane Loader Preview</title>
    <style>
        :root {
            --dark-bg: #090c12;
            --dark-fg: #f7f2e8;
            --dark-surface: rgba(247, 242, 232, 0.11);
            --dark-border: rgba(247, 242, 232, 0.3);
            --light-bg: #f6f4f0;
            --light-fg: #15110c;
            --light-surface: rgba(21, 17, 12, 0.08);
            --light-border: rgba(21, 17, 12, 0.25);
            --font-stack: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-stack);
            color: var(--light-fg);
            background: linear-gradient(180deg, #f6f4f0 0%, #ede9e0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .preview-card {
            width: min(900px, 100%);
            background: #fff;
            border: 1px solid rgba(21, 17, 12, 0.15);
            border-radius: 14px;
            padding: 1.25rem;
            box-shadow: 0 10px 35px rgba(21, 17, 12, 0.12);
        }

        .toolbar {
            display: grid;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
        }

        label {
            font-size: 0.95rem;
            font-weight: 600;
        }

        select,
        input[type="range"] {
            font: inherit;
        }

        .samples {
            display: grid;
            gap: 1rem;
        }

        .sample {
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .sample.dark {
            background: var(--dark-bg);
            color: var(--dark-fg);
        }

        .sample.light {
            background: var(--light-bg);
            color: var(--light-fg);
        }

        .sample h2 {
            margin: 0;
            font-size: 1rem;
        }

        .loader-pill {
            align-self: start;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 999px;
            backdrop-filter: blur(4px);
            border: 1px solid transparent;
            color: currentColor;
        }

        .sample.dark .loader-pill {
            background: rgba(247, 242, 232, 0.15);
            border-color: var(--dark-border);
        }

        .sample.light .loader-pill {
            background: rgba(21, 17, 12, 0.09);
            border-color: var(--light-border);
        }

        .loader-frame {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
            flex: 0 0 auto;
        }

        .small {
            font-size: 0.85rem;
            opacity: 0.85;
        }
    </style>
    <meta name="robots" content="noindex,nofollow,noarchive">
</head>
<body>
    <div class="preview-card">
        <div class="toolbar">
            <div class="toolbar-row">
                <label for="frame-rate">Frame delay (ms):</label>
                <input id="frame-rate" type="range" min="60" max="500" step="20" value="180" />
                <span id="frame-rate-value">180</span>
            </div>
            <div class="toolbar-row">
                <label for="size">Loader size:</label>
                <input id="size" type="range" min="16" max="88" step="2" value="32" />
                <span id="size-value">32</span>
            </div>
            <div class="toolbar-row">
                <label for="loop">Loop:</label>
                <button id="loop">Pause</button>
                <span class="small">Frames: 00-06</span>
            </div>
        </div>

        <div class="samples">
            <section class="sample dark" id="sample-dark">
                <h2>Dark theme loader</h2>
                <div class="loader-pill">
                    <img class="loader-frame" id="dark-frame" src="../../../../shared/53/5379caf98dc03f58295f0478bbea0ec723e97bd443ddd5f4bfc6e946ae659fbe.svg" alt="Loading frame" />
                    <span>Loading page</span>
                </div>
            </section>

            <section class="sample light" id="sample-light">
                <h2>Light theme loader</h2>
                <div class="loader-pill">
                    <img class="loader-frame" id="light-frame" src="../../../../shared/76/76010f0394048a52ec556035630d91c9204895f9c94f9fe83fb61d8fb9ecd180.svg" alt="Loading frame" />
                    <span>Loading page</span>
                </div>
            </section>
        </div>
    </div>

    <script>
        (function () {
            var darkFrames = [
                "../../../../shared/53/5379caf98dc03f58295f0478bbea0ec723e97bd443ddd5f4bfc6e946ae659fbe.svg",
                "../../../../shared/39/3923b030634e2794db68f07b28613082370255f3c478a2c470dc429e34065440.svg",
                "../../../../shared/92/92fdc67d3c9b32e088d84ea9f688d36fec17c19ac666babd7d11d14b68ac0883.svg",
                "../../../../shared/81/8112244f5cbf981ee70cf8fb19c1be4b389621c299752058ffcf4fa89930f228.svg",
                "../../../../shared/07/077bd53154b7b56f5cfe4ee96196ebd2f71ddfbdcf9ccff986afa7c442475071.svg",
                "../../../../shared/74/74672dcdbdcd8ee20497f4b6d92f33cec13f4f86034d2a7c64a5c1b627065530.svg",
                "../../../../shared/76/76010f0394048a52ec556035630d91c9204895f9c94f9fe83fb61d8fb9ecd180.svg"
            ];

            var lightFrames = [
                "../../../../shared/76/76010f0394048a52ec556035630d91c9204895f9c94f9fe83fb61d8fb9ecd180.svg",
                "../../../../shared/32/32f95ab33901c5b3673014d6a099a2eb64a6a08886d253e8b75f97e51cc8a410.svg",
                "../../../../shared/7a/7a99ec1693d4a5cf323e903cce10078291130bf33c35e3e29a30538fa1ec19f7.svg",
                "../../../../shared/6a/6a4e3e2b34311dfe4d063877e5c9884da41643fe1e0f7568dd19ba2aa5dc53bd.svg",
                "../../../../shared/22/22bc214ca99f35008f34c0fc8c8f3a020eb9bbab7562a5400fa2e742f0a14b72.svg",
                "../../../../shared/cb/cbf843fcd47f864d97d926532b30a471a95893e6f376c47c5545e1e7e081ced0.svg",
                "../../../../shared/53/5379caf98dc03f58295f0478bbea0ec723e97bd443ddd5f4bfc6e946ae659fbe.svg"
            ];

            var darkImg = document.getElementById("dark-frame");
            var lightImg = document.getElementById("light-frame");
            var delayInput = document.getElementById("frame-rate");
            var delayDisplay = document.getElementById("frame-rate-value");
            var sizeInput = document.getElementById("size");
            var sizeDisplay = document.getElementById("size-value");
            var loopBtn = document.getElementById("loop");
            var running = true;
            var frameIndex = 0;
            var timerId = null;

            function updateFrames() {
                darkImg.src = darkFrames[frameIndex];
                lightImg.src = lightFrames[frameIndex];
            }

            function startLoop() {
                var delay = parseInt(delayInput.value, 10) || 180;
                clearTimeout(timerId);
                timerId = setTimeout(function tick() {
                    frameIndex = (frameIndex + 1) % darkFrames.length;
                    updateFrames();
                    if (running) {
                        timerId = setTimeout(tick, delay);
                    }
                }, delay);
            }

            function applyDelay() {
                delayDisplay.textContent = delayInput.value;
                if (running) {
                    startLoop();
                }
            }

            function applySize() {
                var size = sizeInput.value + "px";
                sizeDisplay.textContent = sizeInput.value;
                var nodes = document.querySelectorAll(".loader-frame");
                for (var i = 0; i < nodes.length; i++) {
                    nodes[i].style.width = size;
                    nodes[i].style.height = size;
                }
            }

            loopBtn.addEventListener("click", function () {
                running = !running;
                loopBtn.textContent = running ? "Pause" : "Play";
                if (!running) {
                    clearTimeout(timerId);
                } else {
                    startLoop();
                }
            });

            delayInput.addEventListener("input", applyDelay);
            sizeInput.addEventListener("input", applySize);

            // Prime first frame and size.
            updateFrames();
            applySize();
            startLoop();
        }());
    </script>
</body>
</html>
