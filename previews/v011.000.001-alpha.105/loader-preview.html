<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<script src="./hosted-preview.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paravane Loader Preview</title>
    <style>
        :root {
            --dark-bg: #090c12;
            --dark-fg: #f7f2e8;
            --dark-surface: rgba(247, 242, 232, 0.11);
            --dark-border: rgba(247, 242, 232, 0.3);
            --light-bg: #f6f4f0;
            --light-fg: #15110c;
            --light-surface: rgba(21, 17, 12, 0.08);
            --light-border: rgba(21, 17, 12, 0.25);
            --font-stack: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-stack);
            color: var(--light-fg);
            background: linear-gradient(180deg, #f6f4f0 0%, #ede9e0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .preview-card {
            width: min(900px, 100%);
            background: #fff;
            border: 1px solid rgba(21, 17, 12, 0.15);
            border-radius: 14px;
            padding: 1.25rem;
            box-shadow: 0 10px 35px rgba(21, 17, 12, 0.12);
        }

        .toolbar {
            display: grid;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
        }

        label {
            font-size: 0.95rem;
            font-weight: 600;
        }

        select,
        input[type="range"] {
            font: inherit;
        }

        .samples {
            display: grid;
            gap: 1rem;
        }

        .sample {
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .sample.dark {
            background: var(--dark-bg);
            color: var(--dark-fg);
        }

        .sample.light {
            background: var(--light-bg);
            color: var(--light-fg);
        }

        .sample h2 {
            margin: 0;
            font-size: 1rem;
        }

        .loader-pill {
            align-self: start;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 999px;
            backdrop-filter: blur(4px);
            border: 1px solid transparent;
            color: currentColor;
        }

        .sample.dark .loader-pill {
            background: rgba(247, 242, 232, 0.15);
            border-color: var(--dark-border);
        }

        .sample.light .loader-pill {
            background: rgba(21, 17, 12, 0.09);
            border-color: var(--light-border);
        }

        .loader-frame {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
            flex: 0 0 auto;
        }

        .small {
            font-size: 0.85rem;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="preview-card">
        <div class="toolbar">
            <div class="toolbar-row">
                <label for="frame-rate">Frame delay (ms):</label>
                <input id="frame-rate" type="range" min="60" max="500" step="20" value="180" />
                <span id="frame-rate-value">180</span>
            </div>
            <div class="toolbar-row">
                <label for="size">Loader size:</label>
                <input id="size" type="range" min="16" max="88" step="2" value="32" />
                <span id="size-value">32</span>
            </div>
            <div class="toolbar-row">
                <label for="loop">Loop:</label>
                <button id="loop">Pause</button>
                <span class="small">Frames: 00-06</span>
            </div>
        </div>

        <div class="samples">
            <section class="sample dark" id="sample-dark">
                <h2>Dark theme loader</h2>
                <div class="loader-pill">
                    <img class="loader-frame" id="dark-frame" src="/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/a4/a464982dfc7fcff78e473390878a6c08366961329cbd5e40873f6825a9ec12e7.svg" alt="Loading frame" />
                    <span>Loading page</span>
                </div>
            </section>

            <section class="sample light" id="sample-light">
                <h2>Light theme loader</h2>
                <div class="loader-pill">
                    <img class="loader-frame" id="light-frame" src="/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/49/496fb232594cc7e0eb64471b0d0dbd01866047ca1845e2dde8855e385bc8d1bf.svg" alt="Loading frame" />
                    <span>Loading page</span>
                </div>
            </section>
        </div>
    </div>

    <script>
        (function () {
            var darkFrames = [
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/a4/a464982dfc7fcff78e473390878a6c08366961329cbd5e40873f6825a9ec12e7.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/88/8823041f19a147c4f6f2a296b8ae8d581932ee2af20dbe48c08302de75fbf865.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/03/03be89191b32cd5a4f2351626b34bff1a12a129aa0508961aed663b284de1cf9.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/3f/3f0f539b5b93d08b49e217952ea8a32890a2587ee83fccacc3c067aa671d9365.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/f3/f37c7698d266204e9c2a105b17de2fa7501fe5a328622aac40577ce05a72641e.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/09/092d5c9dbe3359448b772a990caa3ff67c5319564d16fccfcb561de5033da98e.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/49/496fb232594cc7e0eb64471b0d0dbd01866047ca1845e2dde8855e385bc8d1bf.svg"
            ];

            var lightFrames = [
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/49/496fb232594cc7e0eb64471b0d0dbd01866047ca1845e2dde8855e385bc8d1bf.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/25/25c65b9dd5c2b3440798b000dd5264cb913920c7737e2820f64c3f72f9671fff.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/7b/7bcce4d836222bb9ecbe095129e3bedc92ad51879e3fe9b9ab91a6d0c5a170b2.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/34/348da86a0a85e4da7cbcb1f0453823b134d41f636e5d108b3cba931409275ef2.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/ae/aec276cb4d877b1df929ed8ae8251298b7b4346c4b9d07ff0797c9ccd3dcbd4e.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/3e/3e25d33f547d6762a38d65a2db2f47c7b47c0e5af740f0a10764bcea2c912dca.svg",
                "/z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84/shared/a4/a464982dfc7fcff78e473390878a6c08366961329cbd5e40873f6825a9ec12e7.svg"
            ];

            var darkImg = document.getElementById("dark-frame");
            var lightImg = document.getElementById("light-frame");
            var delayInput = document.getElementById("frame-rate");
            var delayDisplay = document.getElementById("frame-rate-value");
            var sizeInput = document.getElementById("size");
            var sizeDisplay = document.getElementById("size-value");
            var loopBtn = document.getElementById("loop");
            var running = true;
            var frameIndex = 0;
            var timerId = null;

            function updateFrames() {
                darkImg.src = darkFrames[frameIndex];
                lightImg.src = lightFrames[frameIndex];
            }

            function startLoop() {
                var delay = parseInt(delayInput.value, 10) || 180;
                clearTimeout(timerId);
                timerId = setTimeout(function tick() {
                    frameIndex = (frameIndex + 1) % darkFrames.length;
                    updateFrames();
                    if (running) {
                        timerId = setTimeout(tick, delay);
                    }
                }, delay);
            }

            function applyDelay() {
                delayDisplay.textContent = delayInput.value;
                if (running) {
                    startLoop();
                }
            }

            function applySize() {
                var size = sizeInput.value + "px";
                sizeDisplay.textContent = sizeInput.value;
                var nodes = document.querySelectorAll(".loader-frame");
                for (var i = 0; i < nodes.length; i++) {
                    nodes[i].style.width = size;
                    nodes[i].style.height = size;
                }
            }

            loopBtn.addEventListener("click", function () {
                running = !running;
                loopBtn.textContent = running ? "Pause" : "Play";
                if (!running) {
                    clearTimeout(timerId);
                } else {
                    startLoop();
                }
            });

            delayInput.addEventListener("input", applyDelay);
            sizeInput.addEventListener("input", applySize);

            // Prime first frame and size.
            updateFrames();
            applySize();
            startLoop();
        }());
    </script>
</body>
</html>
