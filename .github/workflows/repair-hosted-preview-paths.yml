name: Repair hosted preview asset paths

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-hosted-preview-paths
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out archive
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Convert project-site URLs to portable relative URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          PUBLIC_REPOSITORY = "z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84"
          TEXT_SUFFIXES = {".css", ".html", ".js", ".json", ".map", ".txt", ".webmanifest", ".xml"}

          output = Path.cwd()
          previews = output / "previews"
          shared = output / "shared"

          def relative_root(file_path, version_root):
              depth = len(file_path.parent.relative_to(version_root).parts)
              return "./" if depth == 0 else "../" * depth

          def relative_url(file_path, target):
              value = os.path.relpath(target, start=file_path.parent).replace(os.sep, "/")
              if not value.startswith("."):
                  value = "./" + value
              return value

          changed = 0
          for version_root in sorted(path for path in previews.iterdir() if path.is_dir()):
              preview_prefix = f"/{PUBLIC_REPOSITORY}/previews/{version_root.name}/"
              shared_prefix = f"/{PUBLIC_REPOSITORY}/shared/"
              for file_path in version_root.rglob("*"):
                  if not file_path.is_file() or file_path.suffix.lower() not in TEXT_SUFFIXES:
                      continue
                  try:
                      content = file_path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  updated = content.replace(preview_prefix, relative_root(file_path, version_root))
                  target_shared = relative_url(file_path, shared)
                  if not target_shared.endswith("/"):
                      target_shared += "/"
                  updated = updated.replace(shared_prefix, target_shared)
                  if updated != content:
                      file_path.write_text(updated, encoding="utf-8", newline="\n")
                      changed += 1

          print(f"Repaired {changed} generated preview files")
          PY

      - name: Verify broken project-site prefixes are gone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repo = "z...PL...ZZ47E2A1...9C63...4F0D...8E5A...71C29B6F3D84"
          needles = (f"/{repo}/previews/", f"/{repo}/shared/")
          suffixes = {".css", ".html", ".js", ".json", ".map", ".txt", ".webmanifest", ".xml"}
          bad = []
          for path in Path("previews").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if any(needle in text for needle in needles):
                  bad.append(path.as_posix())
          if bad:
              raise SystemExit("Broken hosted-preview prefixes remain in: " + ", ".join(bad[:20]))
          print("All generated preview asset paths are portable.")
          PY

      - name: Commit repaired archive and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-hosted-preview-paths.yml
          git add --all
          git commit -m "Repair hosted preview paths for custom domain"
          git push origin HEAD:main
